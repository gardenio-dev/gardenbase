name: Build and Push

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'logo.png'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'logo.png'
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile (filename without .env)"
        required: true
        default: "pg18-postgis3.6"

env:
  DEFAULT_PROFILE: pg18-postgis3.6
  REPOSITORY: gardenio/gardenbase

# A newer run on the same branch supersedes an older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.profile }}
  cancel-in-progress: true

jobs:
  # Build each platform on a native runner (no QEMU emulation).
  # Outside of pull requests, each image is pushed by digest
  # only; the merge job tags them as one multi-platform image.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load profile
        run: |
          PROFILE="${{ github.event.inputs.profile || env.DEFAULT_PROFILE }}"
          echo "Loading profile: ${PROFILE}"
          source "profiles/${PROFILE}.env"
          echo "PROFILE=${PROFILE}" >> "$GITHUB_ENV"
          echo "UBUNTU=${UBUNTU}" >> "$GITHUB_ENV"
          echo "GEOS=${GEOS}" >> "$GITHUB_ENV"
          echo "CGAL=${CGAL}" >> "$GITHUB_ENV"
          echo "SFCGAL=${SFCGAL}" >> "$GITHUB_ENV"
          echo "GDAL=${GDAL}" >> "$GITHUB_ENV"
          echo "PROJ=${PROJ}" >> "$GITHUB_ENV"
          echo "POSTGRES=${POSTGRES}" >> "$GITHUB_ENV"
          echo "POSTGIS=${POSTGIS}" >> "$GITHUB_ENV"
          echo "PGROUTING=${PGROUTING}" >> "$GITHUB_ENV"
          echo "PYTHON=${PYTHON}" >> "$GITHUB_ENV"
          PLATFORM="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.REPOSITORY) || 'type=cacheonly' }}
          build-args: |
            UBUNTU=${{ env.UBUNTU }}
            GEOS=${{ env.GEOS }}
            CGAL=${{ env.CGAL }}
            SFCGAL=${{ env.SFCGAL }}
            GDAL=${{ env.GDAL }}
            PROJ=${{ env.PROJ }}
            POSTGRES=${{ env.POSTGRES }}
            POSTGIS=${{ env.POSTGIS }}
            PGROUTING=${{ env.PGROUTING }}
            PYTHON=${{ env.PYTHON }}
          cache-from: type=gha,scope=${{ env.PROFILE }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PROFILE }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-platform digests into tagged
  # multi-platform manifests. Tags change only if every
  # platform built successfully.
  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create tagged manifests
        run: |
          PROFILE="${{ github.event.inputs.profile || env.DEFAULT_PROFILE }}"
          source "profiles/${PROFILE}.env"
          PG_MAJOR="${POSTGRES%%.*}"
          POSTGIS_MAJOR="${POSTGIS%.*}"
          TAGS=(-t "${REPOSITORY}:${VERSION}" \
                -t "${REPOSITORY}:pg${PG_MAJOR}-postgis${POSTGIS_MAJOR}")
          # Only the default profile on main gets "latest"
          if [ "${{ github.ref }}" = "refs/heads/main" ] && \
             [ "${PROFILE}" = "${DEFAULT_PROFILE}" ]; then
            TAGS+=(-t "${REPOSITORY}:latest")
          fi
          cd "${RUNNER_TEMP}/digests"
          docker buildx imagetools create "${TAGS[@]}" \
            $(printf "${REPOSITORY}@sha256:%s " *)
          docker buildx imagetools inspect "${REPOSITORY}:${VERSION}"

      - name: Update DockerHub description
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: gardenio/gardenbase
          short-description: "PostGIS image built from source for the GardenIO project"
          readme-filepath: ./README.md
